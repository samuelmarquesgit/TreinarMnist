name: Pipeline de CI/CD - Plataforma MNIST

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  qualidade-e-testes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificação Estática de Código (Flake8)
        run: |
          # Para a execução se houver erros de sintaxe ou variáveis indefinidas
          flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Alertas de complexidade e formatação
          flake8 src/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Executar Suíte de Testes Automatizados (Pytest)
        run: |
          pytest tests/ -v --cov=src --cov-report=term-missing
