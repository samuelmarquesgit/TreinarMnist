name: Pipeline de CI/CD - Plataforma MNIST

on:
  push:
    branches: [ main, develop, 'feat/**', 'fix/**', 'docs/**', 'refactor/**', 'test/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  qualidade-e-testes:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necessário para SonarCloud

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff mypy safety

      - name: Verificação de Qualidade (Ruff Linter)
        run: |
          ruff check src/ tests/

      - name: Verificação Estática de Tipos (Mypy)
        run: |
          mypy src/ --ignore-missing-imports

      - name: Executar Suíte de Testes (Pytest)
        run: |
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing

      - name: Cobertura Badge
        if: github.ref == 'refs/heads/main'
        uses: tj-actions/coverage-badge-py@v2
        
      - name: Auditoria de Dependências (Pip Audit)
        run: |
          safety check -r requirements.txt || true

  seguranca-scan:
    name: Security Scans (Secrets & Image)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Verificação de Secrets (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --debug --only-verified

      - name: Construir Imagem Docker para Scan
        run: |
          docker build -t treinarmnist:latest .

      - name: Scan de Vulnerabilidades na Imagem (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'treinarmnist:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  sonarcloud-scan:
    name: SonarCloud Quality Gate
    runs-on: ubuntu-latest
    needs: qualidade-e-testes
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=samuelmarquesgit_TreinarMnist
            -Dsonar.organization=samuelmarquesgit
            -Dsonar.sources=src/
            -Dsonar.python.coverage.reportPaths=coverage.xml

  ci-gate:
    name: CI Gate (Status Check)
    runs-on: ubuntu-latest
    needs: [qualidade-e-testes, seguranca-scan, sonarcloud-scan]
    if: always()
    steps:
      - name: Validar Sucesso dos Jobs Anteriores
        run: |
          if [ "${{ needs.qualidade-e-testes.result }}" != "success" ] || \
             [ "${{ needs.seguranca-scan.result }}" != "success" ] || \
             [ "${{ needs.sonarcloud-scan.result }}" != "success" ]; then
            echo "CI Gate Falhou. Corrija os erros acima."
            exit 1
          else
            echo "CI Gate Aprovado."
            exit 0
          fi
