name: Pipeline de CI/CD - Plataforma MNIST

on:
  push:
    branches: [ main, develop, 'feat/**', 'fix/**', 'docs/**', 'refactor/**', 'test/**', 'chore/**', 'ci/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  qualidade-e-testes:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necessário para SonarCloud

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install safety

      - name: Verificação de Qualidade (Ruff Linter)
        run: |
          ruff check src/ tests/ api/ pipeline_offline/

      - name: Verificação Estática de Tipos (Mypy)
        run: |
          mypy src/ api/ pipeline_offline/ --ignore-missing-imports

      - name: Executar Suíte de Testes (Pytest)
        run: |
          pytest tests/ -v --cov=src --cov=api --cov=pipeline_offline --cov-report=xml --cov-report=term-missing --junitxml=junit-completo.xml

      - name: Resumo dos Testes
        if: always()
        run: python .github/scripts/resumo_testes.py junit-completo.xml coverage.xml "Suíte completa (src + api + pipeline_offline)" >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar Relatório de Cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            junit-completo.xml
          retention-days: 30

      - name: Auditoria de Dependências (Pip Audit)
        run: |
          safety check -r requirements.txt || true

  api-qualidade-e-testes:
    name: API - Qualidade, Testes e Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-api*.txt

      - name: Instalar somente as dependências da API (prova de independência)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt

      - name: Ruff (lint e formatação)
        run: |
          ruff check api/ pipeline_offline/ tests/api/
          ruff format --check api/ tests/api/

      - name: Mypy
        run: mypy api/ --ignore-missing-imports

      - name: Guarda da Fase 3 (nenhuma leitura de disco nas rotas)
        run: |
          if grep -rnE "joblib\.load|open\(|read_bytes\(|read_text\(" api/routers/; then
            echo "::error::Leitura de disco encontrada em api/routers/ (proibido pelo edital)."
            exit 1
          fi
          echo "OK: nenhuma leitura de disco nas rotas."

      - name: Testes da API com cobertura mínima de 85%
        run: |
          pytest tests/api -v --cov=api --cov-report=xml:coverage-api.xml --cov-report=term-missing --cov-fail-under=85 --junitxml=junit-api.xml

      - name: Resumo dos testes da API
        if: always()
        run: python .github/scripts/resumo_testes.py junit-api.xml coverage-api.xml "API FastAPI (requirements-api.txt)" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test com Uvicorn
        run: |
          uvicorn api.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/health | tee saude.json
          python -c "import json; d = json.load(open('saude.json')); assert d['status'] == 'ok' and d['modelo_carregado'], d"
          python -c "import json; from api.schemas.exemplos import PIXELS_DIGITO_7 as p; json.dump({'pixels': p}, open('payload.json', 'w'))"
          curl -sf -X POST http://127.0.0.1:8000/v1/predict -H "Content-Type: application/json" -d @payload.json | tee predicao.json
          python -c "import json; d = json.load(open('predicao.json')); assert d['classe_prevista'] == 7, d"
          echo
          echo "Smoke test OK: /health = ok e /v1/predict = 7"
          cat uvicorn.log

      - name: Publicar relatórios da API
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-api
          path: |
            coverage-api.xml
            junit-api.xml
            uvicorn.log
          retention-days: 30

  api-postman:
    name: API - Coleção Postman (newman)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-api*.txt

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependências de execução da API
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api-execucao.txt

      - name: Subir a API normal (com diagnóstico) e a degradada (sem modelo)
        run: |
          MNIST_API_HABILITAR_DIAGNOSTICO=true uvicorn api.main:app --port 8000 > api-normal.log 2>&1 &
          MNIST_API_CAMINHO_MODELO=models/inexistente.joblib uvicorn api.main:app --port 8001 > api-degradada.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health > /dev/null && curl -sf http://localhost:8001/health > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8000/health && echo && curl -sf http://localhost:8001/health

      - name: Rodar a coleção Postman com newman
        run: |
          npx --yes newman@6.2.3 run docs/postman/API_MNIST.postman_collection.json \
            -e docs/postman/API_MNIST.local.postman_environment.json \
            --reporters cli,junit --reporter-junit-export junit-postman.xml

      - name: Resumo da coleção Postman
        if: always()
        run: python .github/scripts/resumo_testes.py junit-postman.xml - "Coleção Postman (newman) — 200, 400, 404, 405, 422, 500 e 503" >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar relatório do newman
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-postman
          path: |
            junit-postman.xml
            api-normal.log
            api-degradada.log
          retention-days: 30

  seguranca-scan:
    name: Security Scans (Secrets & Image)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Verificação de Secrets (TruffleHog)
        uses: trufflesecurity/trufflehog@v3.99.2
        with:
          path: ./
          extra_args: --debug --only-verified

      - name: Construir Imagem Docker para Scan
        run: |
          docker build -t treinarmnist:latest .

      - name: Scan de Vulnerabilidades na Imagem (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'treinarmnist:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Construir imagem Docker da API (Dockerfile.api)
        run: docker build -f Dockerfile.api -t mnist-api:ci .

      - name: Smoke test do contêiner da API
        run: |
          docker run -d --name mnist-api-ci -p 8000:8000 mnist-api:ci
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:8000/health > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/health
          echo
          docker image inspect mnist-api:ci --format 'Tamanho da imagem: {{.Size}} bytes'
          test "$(docker exec mnist-api-ci whoami)" = "api"
          docker logs mnist-api-ci
          docker rm -f mnist-api-ci

      - name: Scan de Vulnerabilidades na Imagem da API (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'mnist-api:ci'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  sonarcloud-scan:
    name: SonarCloud Quality Gate
    runs-on: ubuntu-latest
    needs: qualidade-e-testes
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baixar Relatório de Cobertura
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=samuelmarquesgit_TreinarMnist
            -Dsonar.organization=samuelmarquesgit
            -Dsonar.sources=src/,api/,pipeline_offline/
            -Dsonar.tests=tests/
            -Dsonar.python.version=3.12
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  ci-gate:
    name: CI Gate (Status Check)
    runs-on: ubuntu-latest
    needs: [qualidade-e-testes, api-qualidade-e-testes, api-postman, seguranca-scan, sonarcloud-scan]
    if: always()
    steps:
      - name: Validar Sucesso dos Jobs Anteriores
        run: |
          if [ "${{ needs.qualidade-e-testes.result }}" != "success" ] || \
             [ "${{ needs.api-qualidade-e-testes.result }}" != "success" ] || \
             [ "${{ needs.api-postman.result }}" != "success" ] || \
             [ "${{ needs.seguranca-scan.result }}" != "success" ] || \
             [ "${{ needs.sonarcloud-scan.result }}" != "success" ]; then
            echo "CI Gate Falhou. Corrija os erros acima."
            exit 1
          else
            echo "CI Gate Aprovado."
            exit 0
          fi
